name: Publish StegGuardian Wiki

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stegguardian-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ST-017 isolated validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Guardian activation orchestration contract
        run: python scripts/check_guardian_activation_orchestration_contract.py
      - name: Execute Guardian sandbox
        run: python scripts/run_sandbox_validation.py
      - name: Validate aggregate Guardian local state
        run: python scripts/check_guardian_local_state.py
      - name: Upload Guardian sandbox report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stegguardian-st017-sandbox-report
          path: reports/sandbox-first-validation.report.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import custody-bound Publisher activation projection
        run: python scripts/import_publisher_ecosystem_chat_activation.py
      - name: Validate LLM free-tier trust page
        run: python scripts/check_llm_free_tier_trust_chain_page.py
      - name: Validate media pipeline Guardian boundary
        run: python scripts/check_media_pipeline_guardian_boundary.py
      - name: Validate page index
        run: python scripts/check_page_index.py
      - name: Validate page relationship graph
        run: python scripts/check_page_relationship_graph.py
      - name: Validate cross-wiki metadata graph
        run: python scripts/check_cross_wiki_metadata_graph.py
      - name: Validate cross-wiki health status
        run: python scripts/check_cross_wiki_health_status.py
      - name: Validate ecosystem documentation endpoints
        run: python scripts/check_ecosystem_documentation_endpoints.py
      - name: Validate live public record URL verification
        run: python scripts/check_live_public_record_url_verification.py
      - name: Validate live public record fetch tooling
        run: python scripts/check_live_public_record_fetch_tooling.py
      - name: Validate deployment receipt
        run: python scripts/check_deployment_receipt.py
      - name: Validate session coordination status
        run: python scripts/check_session_coordination_status.py
      - name: Validate public records manifest
        run: python scripts/check_public_records_manifest.py
      - name: Validate Pages deployment trigger status
        run: python scripts/check_pages_deployment_trigger_status.py
      - name: Upload Ecosystem Chat activation projection
        uses: actions/upload-artifact@v4
        with:
          name: stegguardian-ecosystem-chat-activation-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/ecosystem-chat-publisher-activation.json
            data/ecosystem-chat-activation-status.json
          if-no-files-found: error
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/pages _site/data _site/receipts _site/docs
          touch _site/.nojekyll
          cp README.md _site/README.md
          cp data/page-index.json _site/data/page-index.json
          cp data/page-metadata.schema.json _site/data/page-metadata.schema.json
          cp data/page-relationship-graph.json _site/data/page-relationship-graph.json
          cp data/cross-wiki-metadata-graph.json _site/data/cross-wiki-metadata-graph.json
          cp data/cross-wiki-health-status.json _site/data/cross-wiki-health-status.json
          cp data/cross-wiki-health-status.schema.json _site/data/cross-wiki-health-status.schema.json
          cp data/ecosystem-documentation-endpoints.json _site/data/ecosystem-documentation-endpoints.json
          cp data/ecosystem-chat-activation-status.json _site/data/ecosystem-chat-activation-status.json
          cp data/ecosystem-chat-publisher-activation.json _site/data/ecosystem-chat-publisher-activation.json
          cp data/live-public-record-url-verification.json _site/data/live-public-record-url-verification.json
          cp data/deployment-receipt.json _site/data/deployment-receipt.json
          cp data/session-coordination-status.json _site/data/session-coordination-status.json
          cp data/pages-deployment-trigger-status.json _site/data/pages-deployment-trigger-status.json
          cp data/public-records-manifest.json _site/data/public-records-manifest.json
          cp docs/STEGGUARDIAN_VERIFICATION_STATUS.md _site/docs/STEGGUARDIAN_VERIFICATION_STATUS.md
          cp docs/PAGES_DEPLOYMENT_TRIGGER_DIAGNOSIS.md _site/docs/PAGES_DEPLOYMENT_TRIGGER_DIAGNOSIS.md
          cp docs/LIVE_PUBLIC_RECORD_URL_FETCH_RUNBOOK.md _site/docs/LIVE_PUBLIC_RECORD_URL_FETCH_RUNBOOK.md
          cp receipts/*.json _site/receipts/
          cp pages/*.md _site/pages/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>StegGuardian Wiki</title>
            <meta name="description" content="Guardian, account, recovery, contestability, and governed-entity documentation for StegVerse.">
            <style>
              :root{color-scheme:light dark;--bg:#f7f8fb;--surface:#fff;--text:#15171b;--muted:#5f6673;--border:#dfe3ea;--accent:#0b57d0;--accent2:#173b72}
              @media(prefers-color-scheme:dark){:root{--bg:#101216;--surface:#171a20;--text:#f4f6f8;--muted:#aeb5c0;--border:#2b313b;--accent:#8ab4f8;--accent2:#bdd2ff}}
              *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
              .wrap{max-width:1080px;margin:0 auto;padding:22px 16px 64px}.nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:28px}.nav a{color:var(--accent);text-decoration:none;font-weight:600}.brand{font-weight:800;color:var(--text)!important;margin-right:auto}
              .hero{background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--surface) 82%,var(--accent) 18%));border:1px solid var(--border);border-radius:22px;padding:28px;margin-bottom:24px}.hero h1{font-size:clamp(2rem,7vw,4rem);line-height:1;margin:0 0 12px}.hero p{max-width:760px;color:var(--muted);font-size:1.08rem;margin:0}.pill{display:inline-block;margin-top:16px;padding:7px 11px;border:1px solid var(--border);border-radius:999px;color:var(--accent2);font-weight:700;background:var(--surface)}
              h2{margin:30px 0 12px;font-size:1.35rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{display:block;padding:17px;border:1px solid var(--border);border-radius:16px;background:var(--surface);text-decoration:none;color:var(--text)}.card:hover{border-color:var(--accent)}.card strong{display:block;margin-bottom:6px}.card span{display:block;color:var(--muted);font-size:.95rem}
              details{margin-top:22px;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:14px 16px}summary{cursor:pointer;font-weight:750}.records{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:14px}.records a{color:var(--accent);text-decoration:none}
              .boundary{margin-top:26px;color:var(--muted);font-size:.94rem}.footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:.9rem}
            </style>
          </head>
          <body>
            <main class="wrap">
              <nav class="nav" aria-label="StegGuardian navigation">
                <a class="brand" href="/">StegGuardian Wiki</a>
                <a href="https://stegverse.org/">StegVerse</a>
                <a href="https://admissibility.stegverse.org/">Admissibility</a>
                <a href="https://stegtalk.stegverse.org/">StegTalk</a>
              </nav>

              <section class="hero">
                <h1>StegGuardian</h1>
                <p>Public documentation for Guardian relationships, account boundaries, recovery authority, contestability, and governed-entity protections across StegVerse.</p>
                <span class="pill">Documentation projection — no execution authority</span>
              </section>

              <h2>Guardian foundations</h2>
              <section class="grid">
                <a class="card" href="pages/stegtalk-guardian-account-boundary.md"><strong>StegTalk Guardian &amp; Account Boundary</strong><span>How Guardian roles intersect with StegTalk accounts and communications.</span></a>
                <a class="card" href="pages/guardian-account-boundary-vocabulary.md"><strong>Guardian Account Boundary Vocabulary</strong><span>Shared terms for identity, account, authority, and boundary reasoning.</span></a>
                <a class="card" href="pages/recovery-authority.md"><strong>Recovery Authority</strong><span>What recovery may do, what it may not do, and where authority must stop.</span></a>
                <a class="card" href="pages/account-federation.md"><strong>Account Federation</strong><span>Cross-account relationships and federation boundaries without collapsing identity.</span></a>
              </section>

              <h2>Enforcement &amp; governed operation</h2>
              <section class="grid">
                <a class="card" href="pages/device-bound-guardian-enforcement.md"><strong>Device-Bound Guardian Enforcement</strong><span>Device-local enforcement posture and bounded Guardian action.</span></a>
                <a class="card" href="pages/entity-sandbox-runner-repair-reentry-flow.md"><strong>Entity Sandbox Repair &amp; Reentry</strong><span>Repair, validation, and reentry flow for governed entities.</span></a>
                <a class="card" href="pages/media-pipeline-guardian-boundary.md"><strong>Media Pipeline Guardian Boundary</strong><span>Guardian constraints around media handling and governed delivery.</span></a>
                <a class="card" href="pages/temporal-governed-analysis-guardian-boundary.md"><strong>Temporal Governed Analysis Boundary</strong><span>Contestable time-aware analysis with explicit evidence and authority limits.</span></a>
                <a class="card" href="pages/llm-free-tier-trust-chain.md"><strong>LLM Free-Tier Trust Chain</strong><span>Trust-envelope documentation for bounded model access and provenance.</span></a>
              </section>

              <h2>Verification &amp; public operations</h2>
              <section class="grid">
                <a class="card" href="docs/STEGGUARDIAN_VERIFICATION_STATUS.md"><strong>Verification Status</strong><span>Current documented verification posture.</span></a>
                <a class="card" href="docs/PAGES_DEPLOYMENT_TRIGGER_DIAGNOSIS.md"><strong>Pages Deployment Diagnosis</strong><span>Publication trigger and deployment troubleshooting evidence.</span></a>
                <a class="card" href="docs/LIVE_PUBLIC_RECORD_URL_FETCH_RUNBOOK.md"><strong>Public Record Verification Runbook</strong><span>How live machine-readable records are checked after deployment.</span></a>
              </section>

              <details>
                <summary>Technical records and machine-readable surfaces</summary>
                <div class="records">
                  <a href="data/page-index.json">Page Index</a>
                  <a href="data/page-metadata.schema.json">Page Metadata Schema</a>
                  <a href="data/page-relationship-graph.json">Page Relationship Graph</a>
                  <a href="data/cross-wiki-metadata-graph.json">Cross-Wiki Metadata Graph</a>
                  <a href="data/cross-wiki-health-status.json">Cross-Wiki Health Status</a>
                  <a href="data/cross-wiki-health-status.schema.json">Cross-Wiki Health Schema</a>
                  <a href="data/ecosystem-documentation-endpoints.json">Ecosystem Documentation Endpoints</a>
                  <a href="data/ecosystem-chat-activation-status.json">Ecosystem Chat Activation Status</a>
                  <a href="data/ecosystem-chat-publisher-activation.json">Publisher Activation Projection</a>
                  <a href="data/live-public-record-url-verification.json">Live Public URL Verification</a>
                  <a href="data/deployment-receipt.json">Deployment Receipt</a>
                  <a href="data/session-coordination-status.json">Session Coordination Status</a>
                  <a href="data/pages-deployment-trigger-status.json">Pages Deployment Trigger Status</a>
                  <a href="data/public-records-manifest.json">Public Records Manifest</a>
                </div>
              </details>

              <p class="boundary"><strong>Boundary:</strong> this wiki documents Guardian concepts, projections, and verification state. Publication does not itself grant Guardian, execution, custody, admissibility, release, or certification authority.</p>
              <footer class="footer">StegGuardian Wiki · governed-entity documentation within the StegVerse ecosystem.</footer>
            </main>
          </body>
          </html>
          HTML
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-public-records:
    name: Verify deployed machine records
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch deployed records with bounded retries
        id: live_records
        shell: bash
        run: |
          set +e
          mkdir -p reports
          result=1
          for attempt in $(seq 1 12); do
            echo "Live record verification attempt ${attempt}/12"
            python scripts/fetch_live_public_record_urls.py --timeout 15 --write-report reports/live-public-record-url-fetch-report.json
            result=$?
            if [ "$result" -eq 0 ]; then break; fi
            if [ "$attempt" -lt 12 ]; then sleep 15; fi
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload live verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stegguardian-live-public-record-url-fetch-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/live-public-record-url-fetch-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce live record verification result
        run: |
          if [ "${{ steps.live_records.outputs.result }}" != "0" ]; then
            echo "Deployed machine-record verification did not converge within the bounded retry window." >&2
            exit 1
          fi
      - name: Write verification summary
        if: always()
        run: |
          echo "## StegGuardian Live Public Record Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report artifact:** stegguardian-live-public-record-url-fetch-report-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bounded retries:** 12 attempts, 15 seconds apart" >> "$GITHUB_STEP_SUMMARY"
          echo "**Authority boundary:** URL availability does not grant standing, Guardian authority, or execution authority" >> "$GITHUB_STEP_SUMMARY"
